name: Tests

# Runs on every push and every pull request, and after every refresh. This is also
# the only job that runs the WHOLE suite: a refresh deliberately runs its own
# provider's tests and no other's, so a regression that crosses providers has to be
# caught here or nowhere.
#
# The refresh workflows do not open pull requests -- they commit straight to main --
# and that is what the `workflow_run` trigger below is for. A push made with
# GITHUB_TOKEN triggers no workflow, so the bot's commits, which are most of the
# commits this repository receives, never reached this job at all. On 2026-09-14 one
# of them left main red and nothing said so. Each refresh now tests its own candidate
# before committing, which is the actual fix; this trigger is the net beneath it, and
# it is the only thing that sees a bot commit through another provider's eyes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows:
      - "Refresh prices (Eden AI)"
      - "Refresh prices (Hugging Face)"
      - "Refresh prices (Mistral)"
      - "Refresh prices (OVH)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Deliberately not gated on the refresh having concluded `success`. A refresh
    # commits and pushes, and only then reports any inventory change; if that last
    # step fails -- a GitHub API hiccup is enough -- the run concludes failure with a
    # commit already on main, which is exactly the commit this job exists to look at.
    # Gating on success would skip the net precisely when something odd just happened.
    # A refresh that failed earlier and committed nothing costs one redundant run of a
    # two-second suite, which is the cheaper mistake by a wide margin.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Consumers pin nothing; the scraper must keep working on whatever the
        # runner ships for a while.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # On a workflow_run event the default checkout is the default branch's tip,
          # which is usually -- but not necessarily -- the commit the refresh just
          # pushed. Naming it means this run reports on the commit that triggered it.
          # Empty on every other event, where the default is already right.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      # Says out loud, on every change that touches the file, that what consumers
      # read still satisfies the contract -- before a merge, and again after a
      # refresh has committed.
      - name: Validate the published pricing.json
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          import pricing_validate as validate
          validate.validate_document(json.load(open('pricing.json')))
          print('pricing.json satisfies schema_version', validate.SCHEMA_VERSION)
          "

  # A separate job, and deliberately only here. pyrightconfig.json sat in this
  # repository for weeks with nothing running it, which is how five type errors
  # accumulated -- three of them written on 2026-09-14 by someone who had the config
  # in front of them. A checked-in configuration that no job honours is decoration.
  #
  # It must never run inside a refresh. A type error is a statement about source code,
  # not about whether a price was read correctly, and letting one stop the weekly
  # publication would be the same mistake as gating a refresh on another provider's
  # fixtures. Here it gates what humans push and nothing else.
  #
  # The version is pinned: an unpinned checker starts failing on its own release
  # schedule, on a commit that changed nothing.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          # pyrightconfig.json declares pythonVersion 3.10, the floor consumers get.
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same pin as the schema job. Without it pyright cannot resolve the guarded
      # import in tests/test_pricing_schema.py and reports a missing module where the
      # code is deliberately optional about it.
      - name: Install a JSON Schema implementation
        run: python3 -m pip install --quiet "jsonschema==4.23.0"

      - name: Check types
        run: npx --yes pyright@1.1.414

  # pricing.json is published at a stable public URL and declares a schema_version,
  # and the README tells a consumer that does not recognise that number to ignore the
  # file -- which presumes the number can be looked up. pricing.schema.json is that
  # lookup, generated from pricing_validate.py so there is still one definition of the
  # contract rather than two that drift.
  #
  # Two things are checked, and the second is why this job needs a library the
  # repository itself does not depend on: that the committed artifact is what the
  # validator currently describes, and that it behaves -- it accepts the published
  # file and refuses every document the Python validator refuses. A schema that
  # accepts everything is worse than no schema, because it hands a consumer a false
  # assurance.
  #
  # Like the type check, never inside a refresh. A stale artifact is a red build, not
  # a reason to stop publishing a price that was read correctly.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The only place in this repository anything is installed. It is a checker, not
      # a runtime dependency: no scraper imports it, and the suite skips these tests
      # where it is absent.
      - name: Install a JSON Schema implementation
        run: python3 -m pip install --quiet "jsonschema==4.23.0"

      - name: Check the schema still describes the validator
        run: python3 scripts/build_schema.py --check

      - name: Check the schema accepts the file and refuses what it should
        run: python3 -m unittest -v tests.test_pricing_schema
