name: Refresh prices (OVH)

# Reads OVH's public AI Endpoints catalog once a week and works out whether
# pricing.json's providers.ovh block should change. It has exactly three
# outcomes, and never a fourth:
#
#   figures unchanged  -> commit the checked_utc stamp straight to main
#   a figure changed   -> commit the stamp, then open a pull request. Never merge it.
#   fetch/parse failed -> open an issue, fail the job, leave pricing.json untouched
#
# pricing.json holds one block per provider under `providers.<name>`. This workflow
# only ever touches `providers.ovh`; every other provider's block is carried through
# by the scraper itself (merge_provider_block()) exactly as committed. This file
# follows the exact pattern of refresh-mistral.yml and joins the SAME concurrency
# group below so the two queue on pricing.json writes instead of racing each other.
#
# The stamp commit happens on EVERY successful run, including the run that opens a
# pull request. It is a real statement to consumers ("confirmed unchanged today"),
# and it is also what keeps this workflow alive: GitHub disables a scheduled
# workflow after 60 days without repository activity, and only new commits reset
# that timer -- not tags, not issues, not merged pull requests. A repository whose
# content changes every few months is exactly the profile that gets switched off.
#
# The scraper needs no API key of any kind and must never be given one. It reads a
# public page. There are no secrets in this workflow beyond the automatic
# GITHUB_TOKEN, which is used only to commit, to open a pull request, and to file
# an issue.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC -- an hour after Mistral's, so the two
    # scheduled runs don't both land in the same minute and fight over the
    # pricing-json-writes concurrency group every single week.
  workflow_dispatch: # so a human can force a check
    inputs:
      dry_run:
        description: "Check the page and report, but commit nothing and open nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Shared with every other provider's refresh-<name>.yml on purpose: they all
  # write to the same pricing.json, so they must queue, never run concurrently.
  group: pricing-json-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A scraper whose own tests fail has no business publishing a number.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v

      - name: Read the AI Endpoints catalog
        id: scrape
        continue-on-error: true
        run: python3 scripts/providers/ovh/scrape.py --out-dir .ci-out

      # ---------------------------------------------------------------------------
      # Outcome 3: something failed. Report it, change nothing, fail the job.
      # ---------------------------------------------------------------------------
      - name: Report failure and stop
        if: steps.tests.outcome == 'failure' || steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "The test suite failed, so the scraper was not trusted to publish anything." \
              > /tmp/reason.txt
          elif [ -s .ci-out/error.txt ]; then
            cp .ci-out/error.txt /tmp/reason.txt
          else
            echo "The scraper failed without writing a reason. See the run log." > /tmp/reason.txt
          fi

          # Built by concatenation, never by interpolating the reason into a shell string:
          # the reason quotes text taken from a page this repository does not control.
          {
            cat <<'INTRO'
          The weekly OVH price check did not complete. `pricing.json` has **not** been
          modified: providers.ovh still shows the figures a human last reviewed, and its
          `checked_utc` still shows when they were last actually verified.

          ```
          INTRO
            cat /tmp/reason.txt
            echo '```'
            echo
            echo "Run: ${RUN_URL}"
            echo "Page: https://www.ovhcloud.com/fr/public-cloud/ai-endpoints/catalog/"
            cat <<'OUTRO'

          This almost always means the catalog changed shape rather than a price
          changing -- OVH embeds its model list as JSON inside a Next.js data chunk, so a
          framework or page redesign can move or rename that structure entirely. Compare
          the page against `scripts/providers/ovh/mapping.json`, fix the mapping by hand,
          and re-run the workflow from the Actions tab.
          OUTRO
          } > /tmp/issue-body.md

          # One issue per outage, not one per week: comment on the open one if there is one.
          # Scoped to an OVH-specific label so a stuck Mistral failure never suppresses a
          # fresh OVH notification or vice versa.
          EXISTING="$(gh issue list --label scraper-failure:ovh --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
            echo "Commented on existing issue #$EXISTING"
          else
            gh label create scraper-failure:ovh --color d73a4a --description "The OVH price scraper could not complete" 2>/dev/null || true
            gh issue create \
              --title "OVH price check failed on $(date -u +%Y-%m-%d)" \
              --label scraper-failure:ovh \
              --body-file /tmp/issue-body.md
          fi

          echo "::error::The OVH price check failed. pricing.json was left untouched."
          exit 1

      - name: Report what was found
        run: |
          {
            echo "### OVH price check"
            echo '```'
            cat .ci-out/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat .ci-out/summary.txt

      # ---------------------------------------------------------------------------
      # Coverage, not prices. Deliberately AFTER the price outcome is settled and
      # deliberately unable to change it: this step reads no price and never fails
      # the job. It answers the one question the scraper cannot ask itself -- is the
      # catalog page still showing everything OVH sells? -- by comparing the page
      # against OVH's own public model list. It exists because the page silently
      # dropped five models it was still serving on 2026-08-04, and nothing in the
      # scrape could have noticed.
      #
      # A gap is a notice, never a failed job: refusing to publish correct prices for
      # nineteen models because a twentieth is missing from a page would also suppress
      # the checked_utc stamp, which is the thing keeping this schedule alive.
      # ---------------------------------------------------------------------------
      - name: Check the catalog still lists everything OVH sells
        id: coverage
        continue-on-error: true
        run: |
          # pipefail, or `tee` would report its own exit code and every run would
          # look like a clean one regardless of what the check actually found.
          set -o pipefail
          mkdir -p .ci-out
          python3 scripts/providers/ovh/check_coverage.py | tee .ci-out/coverage.txt

      - name: Report the coverage result
        run: |
          {
            echo "### OVH catalog coverage"
            echo '```'
            cat .ci-out/coverage.txt 2>/dev/null || echo "The coverage check produced no output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Exit code 2 means "a gap was found", which is a finding. Any other
          # non-zero means the check itself could not run, which is a different thing
          # and must not be reported as though the catalog were fine.
          case "${{ steps.coverage.outcome }}" in
            success) echo "::notice::OVH catalog coverage: no gap." ;;
            *) echo "::warning::OVH catalog coverage: see the job summary. Either OVH sells a model its catalog page no longer lists, or the check could not run. No price was affected." ;;
          esac

      - name: Dry run - stopping before anything is written
        if: inputs.dry_run
        run: |
          echo "::notice::Dry run - nothing committed, no pull request opened."

      # ---------------------------------------------------------------------------
      # Every successful run: commit the verification stamp to main.
      # ---------------------------------------------------------------------------
      - name: Commit the verification stamp
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          cp .ci-out/stamped.json pricing.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- pricing.json; then
            echo "Nothing to stamp; pricing.json is already current."
            exit 0
          fi

          git add pricing.json
          git commit -m "chore: verified ovh prices unchanged at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          # Note: a push made with GITHUB_TOKEN does not trigger further workflow runs.
          # Nothing here depends on it -- the trigger is the schedule, not the push.

      # ---------------------------------------------------------------------------
      # Outcome 2: a figure moved. A human decides, not this job.
      # ---------------------------------------------------------------------------
      - name: Open a pull request for the new figures
        if: ${{ steps.scrape.outputs.outcome == 'changed' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A branch name derived from the figures themselves, so a change that persists
          # for weeks keeps updating one pull request instead of opening a new one every
          # Monday. Prefixed with the provider so it can never collide with Mistral's.
          BRANCH="price-update/ovh-$(python3 -c "
          import hashlib, json
          models = json.load(open('.ci-out/updated.json'))['providers']['ovh']['models']
          print(hashlib.sha256(json.dumps(models, sort_keys=True).encode()).hexdigest()[:8])
          ")"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "::notice::A pull request for exactly these figures is already open. Nothing to do."
            exit 0
          fi

          git checkout -b "$BRANCH"
          cp .ci-out/updated.json pricing.json
          git add pricing.json
          git commit -m "prices: update ovh figures read from the AI Endpoints catalog on $(date -u +%Y-%m-%d)"
          git push --force --set-upstream origin "$BRANCH"

          # Same rule as the issue body: the summary is concatenated in, never
          # interpolated into a shell string.
          {
            cat <<'INTRO'
          The scraper read different figures on <https://www.ovhcloud.com/fr/public-cloud/ai-endpoints/catalog/>.

          ```
          INTRO
            cat .ci-out/summary.txt
            echo '```'
            cat <<'OUTRO'

          **Check the catalog yourself before merging.** This is scraped from a page with
          no contract and no versioning behind it, and these numbers become the numbers
          other projects display to their users. Figures are read in EUR specifically,
          from the `/fr/` locale of the catalog -- a currency change would mean this whole
          mapping needs revisiting, not just the figures.

          Only `providers.ovh` is touched by this PR -- every other provider's block is
          carried through byte-for-byte.
          OUTRO
            echo
            echo "Merging publishes these figures to every consumer that fetches"
            echo "\`raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/pricing.json\`."
          } > /tmp/pr-body.md

          gh pr create \
            --title "prices: ovh figures changed on the AI Endpoints catalog" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
