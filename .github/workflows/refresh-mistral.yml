name: Refresh prices (Mistral)

# Reads a public marketing page once a week and works out whether pricing.json's
# providers.mistral block should change. It has exactly three outcomes, and never
# a fourth:
#
#   figures unchanged  -> commit the checked_utc stamp straight to main
#   a figure changed   -> commit the new figures straight to main
#   fetch/parse failed -> open an issue, fail the job, leave pricing.json untouched
#
# pricing.json holds one block per provider under `providers.<name>`. This workflow
# only ever touches `providers.mistral`; every other provider's block, once one
# exists, is carried through by the scraper itself (merge_provider_block()) exactly
# as committed. A future provider gets its own refresh-<name>.yml, following this
# one, and joins the SAME concurrency group below so the two queue on pricing.json
# writes instead of racing each other.
#
# A commit happens on EVERY successful run, whether or not a figure moved. When
# nothing moved it is a real statement to consumers ("confirmed unchanged today"),
# and it is also what keeps this workflow alive: GitHub disables a scheduled
# workflow after 60 days without repository activity, and only new commits reset
# that timer -- not tags, not issues, nothing but commits. A repository whose
# content changes every few months is exactly the profile that gets switched off.
#
# The scraper needs no API key of any kind and must never be given one. It reads a
# public page. There are no secrets in this workflow beyond the automatic
# GITHUB_TOKEN, which is used only to commit, and to file and assign an issue
# when the check fails.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch: # so a human can force a check
    inputs:
      dry_run:
        description: "Check the source and report, but commit nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with every other provider's refresh-<name>.yml on purpose: they all
  # write to the same pricing.json, so they must queue, never run concurrently.
  group: pricing-json-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A scraper whose own tests fail has no business publishing a number.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v

      - name: Read the pricing page
        id: scrape
        continue-on-error: true
        run: python3 scripts/providers/mistral/scrape.py --out-dir .ci-out

      # ---------------------------------------------------------------------------
      # Outcome 3: something failed. Report it, change nothing, fail the job.
      # ---------------------------------------------------------------------------
      - name: Report failure and stop
        if: steps.tests.outcome == 'failure' || steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "The test suite failed, so the scraper was not trusted to publish anything." \
              > /tmp/reason.txt
          elif [ -s .ci-out/error.txt ]; then
            cp .ci-out/error.txt /tmp/reason.txt
          else
            echo "The scraper failed without writing a reason. See the run log." > /tmp/reason.txt
          fi

          # Built by concatenation, never by interpolating the reason into a shell string:
          # the reason quotes text taken from a page this repository does not control.
          {
            cat <<'INTRO'
          The weekly Mistral price check did not complete. `pricing.json` has **not** been
          modified: providers.mistral still shows the figures last successfully verified, and its
          `checked_utc` still shows when they were last actually verified.

          ```
          INTRO
            cat /tmp/reason.txt
            echo '```'
            echo
            echo "Run: ${RUN_URL}"
            echo "Page: https://mistral.ai/pricing/api"
            cat <<'OUTRO'

          This almost always means the page changed shape rather than the price changing.
          Compare the page against `scripts/providers/mistral/mapping.json`, fix the mapping
          by hand, and re-run the workflow from the Actions tab.
          OUTRO
          } > /tmp/issue-body.md

          # One issue per outage, not one per week: comment on the open one if there is one.
          # Scoped to a Mistral-specific label so a stuck OVH failure, once that workflow
          # exists, never suppresses a fresh Mistral notification or vice versa.
          EXISTING="$(gh issue list --label scraper-failure:mistral --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
            echo "Commented on existing issue #$EXISTING"
          else
            gh label create scraper-failure:mistral --color d73a4a --description "The Mistral price scraper could not complete" 2>/dev/null || true
            # --assignee, not just the label: being assigned notifies the owner
            # through a different channel than watching the repository, one that is
            # on by default and that a busy notification inbox does not bury. It also
            # subscribes them to the issue, so the `gh issue comment` path above --
            # taken on every repeat failure -- notifies them too.
            gh issue create \
              --assignee ${{ github.repository_owner }} \
              --title "Mistral price check failed on $(date -u +%Y-%m-%d)" \
              --label scraper-failure:mistral \
              --body-file /tmp/issue-body.md
          fi

          echo "::error::The Mistral price check failed. pricing.json was left untouched."
          exit 1

      - name: Report what was found
        run: |
          {
            echo "### Mistral price check"
            echo '```'
            cat .ci-out/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat .ci-out/summary.txt

      - name: Dry run - stopping before anything is written
        if: inputs.dry_run
        run: |
          echo "::notice::Dry run - nothing committed, nothing published."

      # ---------------------------------------------------------------------------
      # Every successful run commits, straight to main. Whether a figure moved only
      # changes WHICH candidate is promoted and what the message says -- there is no
      # review gate, on purpose.
      #
      # A price moving is not a decision anybody makes: the provider already changed
      # it, and refusing to publish only means shipping a figure known to be stale.
      # What a reviewer would actually have caught -- a misparse -- is caught earlier
      # and harder, by bounds and the change-factor limit in pricing_validate.py, and
      # that path fails the job instead of reaching here. Anything that gets this far
      # is a plausible figure within a factor of 5 of the last one.
      #
      # The commit is the record. `git log -- pricing.json` shows every price move,
      # dated, with the figures in the diff.
      # ---------------------------------------------------------------------------
      - name: Commit the figures
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${{ steps.scrape.outputs.outcome }}" = "changed" ]; then
            # updated.json carries the new figures AND the fresh checked_utc, so this
            # is one commit, not a stamp followed by a correction.
            cp .ci-out/updated.json pricing.json
            MESSAGE="prices: mistral figures changed on $(date -u +%Y-%m-%d)"
          else
            cp .ci-out/stamped.json pricing.json
            MESSAGE="chore: verified mistral prices unchanged at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- pricing.json; then
            echo "Nothing to commit; pricing.json is already current."
            exit 0
          fi

          git add pricing.json
          git commit -m "$MESSAGE"
          git push
          # Note: a push made with GITHUB_TOKEN does not trigger further workflow runs.
          # Nothing here depends on it -- the trigger is the schedule, not the push.

          if [ "${{ steps.scrape.outputs.outcome }}" = "changed" ]; then
            echo "::notice::mistral prices changed and are now published. See the job summary for the diff."
          fi
